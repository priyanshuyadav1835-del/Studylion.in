<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Lion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
:root{--bg:#050805;--card:#0b100c;--line:#16301f;--green:#22c55e;--text:#f4f7f4;--muted:#93a39a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#0d2a17 0,var(--bg) 55%);color:var(--text);font-family:"Playfair Display","Noto Sans Devanagari",Georgia,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font-family:inherit}
[hidden]{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;padding:12px 18px;background:linear-gradient(var(--bg),rgba(5,8,5,.85))}
.ib{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--green);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px;flex:1}
.ib:focus-visible,.cls:focus-visible,.batch:focus-visible,.tab:focus-visible,.lec:focus-visible,.dl:focus-visible,input:focus-visible,.app:focus-visible{outline:3px solid var(--green);outline-offset:3px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;z-index:50;background:#070c08;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 20px;display:flex;flex-direction:column;gap:8px;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
body.open #scrim{opacity:1;visibility:visible}
body.open #drawer{transform:none;visibility:visible}
#drawer h2{margin:0 0 12px;color:var(--green);font-size:1.4rem}
.dl{background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:12px;text-align:left;font-size:1rem;cursor:pointer}
.made{margin-top:auto;color:var(--muted);font-size:.9rem;padding-top:16px}
.made b{color:var(--green)}
#home{text-align:center;padding-top:6px}
.lion{width:190px;height:190px;filter:drop-shadow(0 0 24px rgba(34,197,94,.4))}
h1{font-size:2.1rem;margin:12px 0 0;line-height:1.2}
h1 em{display:block;font-style:normal;color:var(--green);font-size:2.6rem;text-shadow:0 0 22px rgba(34,197,94,.45)}
.tag{margin:10px 0 28px;font-size:1.05rem}
.tag b{color:var(--green)}
.apps{display:grid;grid-template-columns:minmax(0,240px);justify-content:center;gap:60px 14px;margin-top:50px;align-items:start}
.app{position:relative;display:block;padding:30px 8px 20px;background:var(--card);border:1px solid var(--line);border-radius:24px;color:var(--text);text-decoration:none;cursor:pointer;box-shadow:0 0 30px rgba(34,197,94,.08)}
.icon{position:relative;isolation:isolate;width:92px;height:92px;margin:0 auto 14px}
.icon img{width:100%;height:100%;border-radius:24px;border:2px solid var(--green);box-shadow:0 0 18px rgba(34,197,94,.5);display:block}
.icon svg{position:absolute;left:50%;pointer-events:none}
.icon svg.peek{width:140px;height:140px;margin-left:-70px;top:-88px;z-index:-1;filter:drop-shadow(0 0 14px rgba(34,197,94,.35))}
.icon svg.paws{width:100px;height:30px;margin-left:-50px;top:-8px;z-index:2}
.app span{font-size:1.1rem;font-weight:700}
.app small{display:block;color:var(--muted);margin-top:4px;font-size:.85rem}
#app{display:none;padding-top:4px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top img{width:46px;height:46px;border-radius:12px;border:2px solid var(--green)}
.top h2{margin:0;font-size:1.2rem;line-height:1.2}
.top p{margin:0;color:var(--muted);font-size:.8rem}
.classes{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:22px}
.cls{display:block;width:100%;text-align:center;padding:34px 16px;border-radius:20px;background:linear-gradient(160deg,#10281a,var(--card));border:1.5px solid var(--line);color:var(--text);cursor:pointer}
.cls b{display:block;font-size:2.4rem;line-height:1.2}
.cls small,.chead small{display:block;margin-top:8px;color:var(--muted);font-size:1rem}
.cls em,.chead em{font-style:normal;color:var(--green);font-weight:700}
.cls:active{border-color:var(--green)}
.chead{text-align:center;margin:6px 0 22px}.chead b{display:block;font-size:2.3rem;line-height:1.2}
.lion{animation:lfloat 3.6s ease-in-out infinite}
.icon svg.peek{transform-origin:50% 85%;animation:lbob 3s ease-in-out infinite}
.icon svg.paws{transform-origin:50% 100%;animation:lpaw 3s ease-in-out infinite}
@keyframes lfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes lbob{0%,100%{transform:translateY(2px) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes lpaw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.lion,.icon svg.peek,.icon svg.paws{animation:none}}
.cls.on{background:var(--green);border-color:var(--green);color:#03120a}
.hint,.empty{color:var(--muted);font-size:.95rem;border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.batch{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--green);border-radius:16px;padding:20px 18px;color:var(--text);cursor:pointer;box-shadow:0 0 22px rgba(34,197,94,.1)}
.batch b{display:block;font-size:1.25rem}
.batch small{color:var(--muted)}
.bt{margin:0 0 12px;font-size:1.3rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:1rem;font-weight:700;cursor:pointer}
.tab.on{border-color:var(--green);color:var(--green)}
.player{aspect-ratio:16/9;width:100%;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.player iframe{width:100%;height:100%;border:0}
.lec{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;margin-bottom:8px;font-size:1rem;cursor:pointer;text-decoration:none}
.lec[aria-current="true"]{border-color:var(--green)}
.subj{font-size:clamp(2.1rem,11.5vw,3.3rem);font-weight:800;letter-spacing:.12em;text-align:center;color:var(--green);line-height:1.1;margin:6px 0 4px;text-shadow:0 0 26px rgba(34,197,94,.5)}
.subj::after{content:"";display:block;width:70px;height:3px;border-radius:2px;background:var(--green);margin:12px auto 0}
.bt{text-align:center;margin-top:16px}
.sec{margin:20px 0 8px;font-size:1.1rem;color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cards.one{grid-template-columns:1fr}
.cards .batch{padding:22px 14px;min-height:92px}.cards .batch b{font-size:1.1rem;line-height:1.3}
.subj.sm{font-size:clamp(1.6rem,8.6vw,2.5rem);letter-spacing:.08em}
footer{text-align:center;color:var(--muted);padding:26px 0 18px;font-size:.9rem}
footer b{color:var(--green)}
</style>
</head>

};
var S={app:null,cls:null,item:null,tab:'lec'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ytId(u){var m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:null}
function frame(src,title,btn){
var p=$('player');p.hidden=false;p.innerHTML='';
var f=document.createElement('iframe');f.src=src;f.allow='encrypted-media; picture-in-picture; fullscreen';
f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.title=title;p.appendChild(f);
document.querySelectorAll('.lec').forEach(function(b){b.removeAttribute('aria-current')});
if(btn)btn.setAttribute('aria-current','true');
}
function play(u,btn){var id=ytId(u);if(id)frame('https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1&playsinline=1','Lecture',btn)}
function loadPl(id,btn){
if(/claude/i.test(location.hostname)){var p=$('player');p.hidden=false;p.style.aspectRatio='auto';
p.innerHTML='<div style="padding:20px;text-align:center"><p style="margin:0 0 14px;color:#93a39a;line-height:1.6">इस टेस्ट लिंक पर वीडियो नहीं चल सकता। अपनी होस्ट की हुई Study Lion वेबसाइट पर लेक्चर यहीं चलेंगे।</p><a class="lec" style="text-align:center;margin:0" target="_blank" rel="noopener" href="https://www.youtube.com/playlist?list='+id+'">YouTube पर खोलें</a></div>';return}
frame('https://www.youtube-nocookie.com/embed/videoseries?list='+id+'&rel=0&modestbranding=1&playsinline=1','Lecture playlist',btn);
}
function curC(){return APPS[S.app].classes.filter(function(c){return c.n===S.cls})[0]}
function render(){
var a=APPS[S.app],c=curC(),h='';
var cl=$('classes');cl.hidden=!!c;
cl.innerHTML=c?'':a.classes.map(function(k){return'<button type="button" class="cls" data-n="'+k.n+'"><b>कक्षा '+k.n+'</b><small>Education Must Be <em>Free</em></small></button>'}).join('');
var b=$('body'),it=null;
if(!c){h=''}
else if(S.item===null){
h='<div class="chead"><b>कक्षा '+c.n+'</b><small>Education Must Be <em>Free</em></small></div><div class="cards'+(c.items.length===1?' one':'')+'">'+c.items.map(function(x,i){return'<button type="button" class="batch" data-o="'+i+'"><b>'+esc(x.name)+'</b><small>कक्षा '+c.n+'</small></button>'}).join('')+'</div>'}
else{
it=c.items[S.item];var bn=it.banner||it.name.toUpperCase();
h='<div class="subj'+(bn.length>10?' sm':'')+'">'+esc(bn)+'</div><h3 class="bt">'+esc(it.banner?it.name:'कक्षा '+c.n)+'</h3>'
+'<div class="tabs"><button type="button" class="tab'+(S.tab==='lec'?' on':'')+'" data-t="lec">Lectures</button><button type="button" class="tab'+(S.tab==='pdf'?' on':'')+'" data-t="pdf">PDF</button></div>';
if(S.tab==='lec'){
h+='<div class="player" id="player" hidden></div>';
var pl=it.pl||[],multi=pl.some(function(x){return x.sec}),last=null;
h+=pl.map(function(l,i){var s=multi?(l.sec||'Regular Lectures'):'';var hd=(s&&s!==last)?'<h4 class="sec">'+esc(s)+'</h4>':'';last=s;return hd+'<button type="button" class="lec" data-p="'+i+'">▶ '+esc(l.title)+' · '+l.count+' lectures</button>'}).join('');
h+=it.lec.map(function(l,i){return'<button type="button" class="lec" data-i="'+i+'">▶ '+esc(l.title)+'</button>'}).join('');
if(!pl.length&&!it.lec.length)h+='<p class="empty">लेक्चर जल्द जोड़े जाएंगे।</p>'}
else{h+=it.pdf.length?it.pdf.map(function(l){return'<a class="lec" target="_blank" rel="noopener" href="'+esc(l.url)+'">📄 '+esc(l.title)+'</a>'}).join(''):'<p class="empty">PDF जल्द जोड़े जाएंगे।</p>'}
}
b.innerHTML=h;
if(it&&S.tab==='lec'){
b.querySelectorAll('.lec[data-p]').forEach(function(x){x.onclick=function(){loadPl(it.pl[x.dataset.p].id,x)}});
b.querySelectorAll('.lec[data-i]').forEach(function(x){x.onclick=function(){play(it.lec[x.dataset.i].url,x)}});
if(it.pl.length===1&&!it.lec.length)loadPl(it.pl[0].id,b.querySelector('.lec[data-p]'))}
}
function route(){
var k=location.hash.slice(1),a=APPS[k];
if(a&&S.app!==k){S.app=k;S.cls=null;S.item=null;S.tab='lec'}
$('home').style.display=a?'none':'block';$('app').style.display=a?'block':'none';$('back').hidden=!a;
if(a){$('a-img').src=document.querySelector('[data-app="'+k+'"] img').src;$('a-name').textContent=a.name;$('a-tag').textContent=a.tag;render()}
window.scrollTo(0,0)}
function menu(o){document.body.classList.toggle('open',o);$('menu').setAttribute('aria-expanded',o)}
function go(k){menu(false);if(location.hash==='#'+k)route();else location.hash=k}
$('menu').onclick=function(){menu(true)};$('scrim').onclick=function(){menu(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')menu(false)});
$('d-home').onclick=function(){menu(false);location.hash='';route()};
$('d-kmd').onclick=function(){go('kmd')};
$('back').onclick=function(){if(S.item!==null){S.item=null;render()}else if(S.cls!==null){S.cls=null;render()}else{location.hash='';route()}};
$('classes').onclick=function(e){var t=e.target.closest('.cls');if(t){S.cls=+t.dataset.n;S.item=null;S.tab='lec';render();window.scrollTo(0,0)}};
$('body').onclick=function(e){var t=e.target.closest('[data-o],.tab');if(!t)return;if(t.dataset.o!==undefined){S.item=+t.dataset.o;S.tab='lec'}else S.tab=t.dataset.t;render()};
window.addEventListener('hashchange',route);route();

</script>
</body>
